[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "batchpersona"
version = "1.0.0"
description = "Headless batch-processing pipeline for automated model replacement in advertising campaigns using ComfyUI REST/WebSocket API and Qwen Image 2.1 DiT."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dan Azanza" }]
dependencies = [
    "requests>=2.32.0",
    "websocket-client>=1.8.0",
    "pillow>=10.0.0",
    "numpy>=1.24.0",
]
keywords = [
    "comfyui",
    "diffusion-transformer",
    "qwen-image",
    "model-replacement",
    "batch-processing",
    "generative-ai",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/DanAzanza/BatchPersona"
Documentation = "https://github.com/DanAzanza/BatchPersona/blob/main/docs/ARCHITECTURE.md"
Repository = "https://github.com/DanAzanza/BatchPersona.git"
Issues = "https://github.com/DanAzanza/BatchPersona/issues"

[project.scripts]
batchpersona = "batchpersona.orchestrator:main"
batchpersona-pipeline = "batchpersona.pipeline:main"
batchpersona-launcher = "batchpersona.launcher:main"
batchpersona-prep = "batchpersona.preprocess:main"
batchpersona-testdata = "batchpersona.generator:main"
batchpersona-ci = "batchpersona.ci:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "scripts", "tests"]
exclude = ["**/__pycache__", ".pytest_cache", ".venv", ".ci_local_staging"]
pythonVersion = "3.10"
reportMissingImports = "none"
reportMissingModuleSource = "none"
reportCallIssue = "error"
reportAssignmentType = "none"
reportArgumentType = "none"
reportInvalidTypeForm = "none"
reportOptionalMemberAccess = "none"
reportOptionalCall = "none"
reportAttributeAccessIssue = "none"
reportGeneralTypeIssues = "none"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pyright>=1.1.0",
]

[tool.pytest.ini_options]
minversion = "8.0"
pythonpath = [".", "src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["batchpersona", "scripts"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "RUF", # Ruff-specific rules
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
