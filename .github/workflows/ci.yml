name: CI Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: CI Quality Gate (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright
          pip install -r requirements.txt

      - name: Run Ruff Linter
        run: python -m ruff check .

      - name: Run Ruff Format Check
        run: python -m ruff format --check .

      - name: Run Pyright Static Type Checker
        run: python -m pyright scripts tests

      - name: Verify Synthetic Test Data Generator
        run: |
          python scripts/generate_testdata.py --output-dir data_ci --size 256

      - name: Run Automated Test Suite with Coverage
        run: |
          python -m pytest tests --cov=scripts --cov-report=term-missing --cov-report=xml -v

      - name: Upload Test Coverage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14
