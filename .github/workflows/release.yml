name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to build (e.g. v1.0.0)'
        required: false
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  quality-gate:
    name: Release Pre-Flight Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff pyright pytest pytest-cov pytest-mock
          pip install -r requirements.txt
          pip install -e .

      - name: Validate Tag & Version Consistency
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          if [[ -z "$TAG" || "$TAG" == "main" || "$TAG" == "master" ]]; then
            echo "::error::Release must specify a valid version tag (e.g. v1.0.0), got '$TAG'"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+(\.[0-9]+)*(-[a-zA-Z0-9.]+)?$ ]]; then
            echo "::error::Tag '$TAG' does not follow semantic versioning pattern (vX.Y.Z)"
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "Target Release Version: $VERSION"

          # 1. Assert pyproject.toml matches
          PYPROJECT_VER=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])")
          if [ "$PYPROJECT_VER" != "$VERSION" ]; then
            echo "::error::pyproject.toml version ($PYPROJECT_VER) does not match tag ($VERSION)"
            exit 1
          fi

          # 2. Assert batchpersona.__version__ matches
          INIT_VER=$(python -c "import batchpersona; print(batchpersona.__version__)")
          if [ "$INIT_VER" != "$VERSION" ]; then
            echo "::error::batchpersona.__version__ ($INIT_VER) does not match tag ($VERSION)"
            exit 1
          fi

          # 3. Assert commit is on or reachable from default branch
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::Tagged commit is not an ancestor of origin/main. Releases must originate from the main branch."
            exit 1
          fi

          echo "[OK] Tag, pyproject.toml ($PYPROJECT_VER), and __version__ ($INIT_VER) are strictly aligned."

      - name: Run Full Quality Gate (CI Parity)
        run: python scripts/run_ci_locally.py

  publish-release:
    name: Build Distribution & Publish GitHub Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Package Release Distribution
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          VERSION="${TAG#v}"
          python scripts/package_release.py --version "$VERSION" --output-dir dist

      - name: Create GitHub Release & Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          TAG="${INPUT_TAG:-$REF_NAME}"
          gh release create "$TAG" dist/* \
            --title "BatchPersona $TAG" \
            --generate-notes
